<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#34564B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portal WO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Portal Wedding Organizer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite"><p class="loading">Memuat...</p></main>
  <button id="btn-install" class="install-btn" type="button" hidden>[ 📱 Instal Aplikasi ]</button>
  <div id="toast" role="status"></div>
  <dialog id="ios-install-dialog" class="ios-dialog" aria-labelledby="ios-install-title">
    <div class="ios-dialog-body">
      <h2 id="ios-install-title">Pasang di iPhone atau iPad</h2>
      <ol class="ios-steps">
        <li>Buka halaman ini langsung di <strong>Safari</strong>, bukan dari dalam WhatsApp, Instagram, atau aplikasi lain.</li>
        <li>Ketuk tombol <strong>Bagikan</strong> pada bilah Safari.</li>
        <li>Gulir menu, pilih <strong>Tambah ke Layar Utama</strong>, lalu ketuk <strong>Tambah</strong>.</li>
      </ol>
      <form method="dialog">
        <button type="submit" class="ios-dialog-close">Saya mengerti</button>
      </form>
    </div>
  </dialog>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
